<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Inventory | BloodLink</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-body">
    <header class="navbar dashboard-nav">
        <div class="container-fluid nav-container">
            <a href="index.html" class="logo">🩸 BloodLink</a>
            <div class="user-menu" id="user-menu">
                <span id="nav-user-name">Loading...</span>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="hospital-dashboard.html">📊 Dashboard</a></li>
                    <li><a href="hospital-inventory.html" class="active">📦 Inventory</a></li>
                    <li><a href="#blood-requests">📝 Blood Requests</a></li>
                    <li><a href="#activity">📋 Activity</a></li>
                    <li><a href="notifications.html">🔔 Notifications</a></li>
                    <li><a href="#profile">🏥 Profile</a></li>
                    <li><a href="#" id="logout-btn" class="text-danger">🚪 Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header flex-between align-center mb-4">
                <h1>Inventory Management</h1>
                <button class="btn btn-primary" id="btn-add-inventory">+ Add Stock</button>
            </header>

            <div class="dashboard-content">
                <div class="card">
                    <div class="table-responsive">
                        <table class="table" id="full-inventory-table">
                            <thead>
                                <tr>
                                    <th>Blood Group</th>
                                    <th>Component</th>
                                    <th>Available Units</th>
                                    <th>Reserved</th>
                                    <th>Last Updated</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="full-inventory-tbody">
                                <tr><td colspan="6" class="text-center">Loading inventory data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Inventory Modal -->
    <div id="inventory-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Inventory</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="inventory-form">
                    <input type="hidden" id="inv_id" name="inv_id">
                    <div class="form-group">
                        <label for="inv_blood_group">Blood Group</label>
                        <select id="inv_blood_group" name="blood_group" required>
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="inv_component">Component</label>
                        <select id="inv_component" name="component" required>
                            <option value="Whole Blood">Whole Blood</option>
                            <option value="PRBC">Packed Red Blood Cells</option>
                            <option value="Plasma">Plasma</option>
                            <option value="Platelets">Platelets</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="inv_units">Units Available</label>
                        <input type="number" id="inv_units" name="units" min="0" required>
                    </div>
                    <div class="form-actions mt-4 text-right">
                        <button type="button" class="btn btn-outline btn-cancel">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/hospital.js"></script>
</body>
</html>
