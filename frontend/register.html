<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BloodLink</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">🩸 BloodLink</a>
        </div>
    </header>

    <main class="container centered-layout">
        <div class="card auth-card wide-card">
            <div class="text-center mb-4">
                <h2>Create an Account</h2>
                <p>Join the BloodLink network</p>
            </div>
            
            <div class="role-tabs" id="role-tabs">
                <button type="button" class="tab-btn active" data-role="patient">Patient</button>
                <button type="button" class="tab-btn" data-role="donor">Donor</button>
                <button type="button" class="tab-btn" data-role="hospital">Hospital/Blood Bank</button>
            </div>
            
            <div id="error-message" class="alert alert-danger hidden"></div>
            
            <form id="register-form">
                <input type="hidden" id="role" name="role" value="patient">
                
                <!-- Common Fields -->
                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="full_name">Full Name / Organization Name</label>
                        <input type="text" id="full_name" name="full_name" required>
                    </div>
                    <div class="form-group half-width">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required minlength="8">
                        <small class="help-text">Minimum 8 characters</small>
                    </div>
                    <div class="form-group half-width">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>
                
                <!-- Conditional Fields: Donor -->
                <div id="donor-fields" class="conditional-fields hidden">
                    <h3 class="mt-4 mb-2">Donor Details</h3>
                    <div class="form-row">
                        <div class="form-group third-width">
                            <label for="blood_group">Blood Group</label>
                            <select id="blood_group" name="blood_group">
                                <option value="">Select Group</option>
                                <option value="A+">A+</option><option value="A-">A-</option>
                                <option value="B+">B+</option><option value="B-">B-</option>
                                <option value="AB+">AB+</option><option value="AB-">AB-</option>
                                <option value="O+">O+</option><option value="O-">O-</option>
                            </select>
                        </div>
                        <div class="form-group third-width">
                            <label for="city_donor">City</label>
                            <input type="text" id="city_donor" name="city">
                        </div>
                        <div class="form-group third-width">
                            <label for="area_donor">Area/Locality</label>
                            <input type="text" id="area_donor" name="area">
                        </div>
                    </div>
                </div>
                
                <!-- Conditional Fields: Hospital -->
                <div id="hospital-fields" class="conditional-fields hidden">
                    <h3 class="mt-4 mb-2">Organization Details</h3>
                    <div class="form-row">
                        <div class="form-group half-width">
                            <label for="org_type">Organization Type</label>
                            <select id="org_type" name="org_type">
                                <option value="hospital">Hospital</option>
                                <option value="blood_bank">Blood Bank</option>
                                <option value="clinic">Clinic</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="address">Full Address</label>
                        <input type="text" id="address" name="address">
                    </div>
                    <div class="form-row">
                        <div class="form-group half-width">
                            <label for="city_hospital">City</label>
                            <input type="text" id="city_hospital" name="city">
                        </div>
                        <div class="form-group half-width">
                            <label for="state">State</label>
                            <input type="text" id="state" name="state">
                        </div>
                    </div>
                </div>
                
                <div class="form-group checkbox-group mt-4">
                    <label>
                        <input type="checkbox" name="terms" required> I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            
            <div class="auth-links text-center mt-4">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
