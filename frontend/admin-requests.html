<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Requests | Admin | BloodLink</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-body admin-body">
    <header class="navbar dashboard-nav admin-nav">
        <div class="container-fluid nav-container">
            <a href="index.html" class="logo">⚙️ BloodLink Admin</a>
            <div class="user-menu" id="user-menu">
                <span id="nav-user-name">Loading...</span>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar admin-sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="admin-dashboard.html">📊 Dashboard</a></li>
                    <li><a href="admin-users.html">👥 Users</a></li>
                    <li><a href="#hospitals">🏥 Hospitals</a></li>
                    <li><a href="admin-requests.html" class="active">📝 Requests</a></li>
                    <li><a href="#inventory">📦 Inventory</a></li>
                    <li><a href="admin-audit.html">📜 Audit Logs</a></li>
                    <li><a href="#settings">⚙️ Settings</a></li>
                    <li><a href="#" id="logout-btn" class="text-danger">🚪 Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header mb-4">
                <h1>All Blood Requests</h1>
            </header>

            <div class="dashboard-content">
                <div class="card mb-4 filter-card">
                    <form id="filter-all-reqs-form" class="flex-center gap-3 justify-start wrap">
                        <div class="form-group mb-0">
                            <select id="req_status" class="form-control-sm">
                                <option value="">All Statuses</option>
                                <option value="pending">Pending</option>
                                <option value="matched">Matched</option>
                                <option value="fulfilled">Fulfilled</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="form-group mb-0">
                            <select id="req_priority" class="form-control-sm">
                                <option value="">All Priorities</option>
                                <option value="emergency">Emergency</option>
                                <option value="urgent">Urgent</option>
                                <option value="normal">Normal</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-sm btn-primary">Filter</button>
                    </form>
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="table" id="all-requests-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Requester</th>
                                    <th>Blood Group</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="all-requests-tbody">
                                <tr><td colspan="7" class="text-center">Loading requests...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="req-pagination" class="pagination mt-3"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
