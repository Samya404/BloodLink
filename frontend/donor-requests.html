<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compatible Requests | BloodLink</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-body">
    <header class="navbar dashboard-nav">
        <div class="container-fluid nav-container">
            <a href="index.html" class="logo">🩸 BloodLink</a>
            <div class="user-menu" id="user-menu">
                <span id="nav-user-name">Loading...</span>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="donor-dashboard.html">📊 Dashboard</a></li>
                    <li><a href="donor-requests.html" class="active">🩸 Compatible Requests</a></li>
                    <li><a href="#history">🕰️ Donation History</a></li>
                    <li><a href="notifications.html">🔔 Notifications</a></li>
                    <li><a href="donor-profile.html">👤 Profile</a></li>
                    <li><a href="#" id="logout-btn" class="text-danger">🚪 Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header mb-4">
                <h1>Compatible Blood Requests</h1>
                <p class="text-muted mt-1">Requests matching your blood group in your area</p>
            </header>

            <div class="dashboard-content">
                <div class="card mb-4 filter-card">
                    <form id="filter-requests-form" class="flex-center gap-3 justify-start wrap">
                        <div class="form-group mb-0">
                            <label class="sr-only" for="filter-priority">Priority</label>
                            <select id="filter-priority" class="form-control-sm">
                                <option value="">All Priorities</option>
                                <option value="emergency">Emergency</option>
                                <option value="urgent">Urgent</option>
                                <option value="normal">Normal</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline" id="btn-refresh-requests">↻ Refresh</button>
                    </form>
                </div>

                <div id="all-requests-container" class="grid-2">
                    <!-- Cards injected by JS -->
                    <div class="text-center py-5 col-span-2">
                        <p>Loading requests...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/donor.js"></script>
</body>
</html>
