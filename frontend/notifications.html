<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | BloodLink</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-body">
    <header class="navbar dashboard-nav">
        <div class="container-fluid nav-container">
            <a href="index.html" class="logo">🩸 BloodLink</a>
            <div class="user-menu" id="user-menu">
                <span id="nav-user-name">Loading...</span>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar" id="dynamic-sidebar">
            <!-- Populated by JS based on user role -->
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header flex-between align-center mb-4">
                <h1>Notifications</h1>
                <button class="btn btn-sm btn-outline" id="btn-mark-all-read">Mark All as Read</button>
            </header>

            <div class="dashboard-content max-w-3xl">
                <div class="card filter-card mb-4">
                    <div class="flex-center gap-3 justify-start">
                        <button class="btn btn-sm btn-primary" id="filter-all-notif">All</button>
                        <button class="btn btn-sm btn-outline" id="filter-unread-notif">Unread</button>
                    </div>
                </div>

                <div class="notifications-list" id="notifications-container">
                    <!-- Notifications populated by JS -->
                    <div class="text-center py-5 text-muted">
                        <p>Loading notifications...</p>
                    </div>
                </div>
                
                <div id="notif-pagination" class="pagination mt-4"></div>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/socket.js"></script>
</body>
</html>
