<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Request | BloodLink</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-body">
    <header class="navbar dashboard-nav">
        <div class="container-fluid nav-container">
            <a href="index.html" class="logo">🩸 BloodLink</a>
            <div class="user-menu" id="user-menu">
                <span id="nav-user-name">Loading...</span>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="patient-dashboard.html">📊 Dashboard</a></li>
                    <li><a href="blood-search.html">🔍 Find Blood</a></li>
                    <li><a href="create-request.html" class="active">📝 Create Request</a></li>
                    <li><a href="patient-dashboard.html#my-requests">📋 My Requests</a></li>
                    <li><a href="notifications.html">🔔 Notifications</a></li>
                    <li><a href="#" id="logout-btn" class="text-danger">🚪 Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header mb-4">
                <h1>Create Blood Request</h1>
            </header>

            <div class="dashboard-content max-w-3xl">
                <div class="alert alert-info mb-4">
                    <strong>Guidelines:</strong> Please ensure all details are accurate. Emergency requests will immediately notify all compatible donors in your area.
                </div>

                <div class="card form-card">
                    <form id="create-request-form">
                        <div class="form-row">
                            <div class="form-group half-width">
                                <label for="blood_group">Blood Group Required *</label>
                                <select id="blood_group" name="blood_group" required>
                                    <option value="">Select Group</option>
                                    <option value="A+">A+</option><option value="A-">A-</option>
                                    <option value="B+">B+</option><option value="B-">B-</option>
                                    <option value="AB+">AB+</option><option value="AB-">AB-</option>
                                    <option value="O+">O+</option><option value="O-">O-</option>
                                </select>
                            </div>
                            <div class="form-group half-width">
                                <label for="component">Component *</label>
                                <select id="component" name="component" required>
                                    <option value="Whole Blood">Whole Blood</option>
                                    <option value="PRBC">Packed Red Blood Cells</option>
                                    <option value="Plasma">Plasma</option>
                                    <option value="Platelets">Platelets</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group half-width">
                                <label for="units">Units Required *</label>
                                <input type="number" id="units" name="units" min="1" max="50" required value="1">
                            </div>
                            <div class="form-group half-width">
                                <label for="required_by">Required By (Date & Time) *</label>
                                <input type="datetime-local" id="required_by" name="required_by" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Priority Level *</label>
                            <div class="priority-options">
                                <label class="priority-radio">
                                    <input type="radio" name="priority" value="normal" checked>
                                    <span class="badge badge-info">Normal</span>
                                </label>
                                <label class="priority-radio">
                                    <input type="radio" name="priority" value="urgent">
                                    <span class="badge badge-warning">Urgent (Within 48h)</span>
                                </label>
                                <label class="priority-radio">
                                    <input type="radio" name="priority" value="emergency">
                                    <span class="badge badge-danger">Emergency (ASAP)</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group half-width">
                                <label for="hospital_name">Hospital Name *</label>
                                <input type="text" id="hospital_name" name="hospital_name" required placeholder="e.g. City General Hospital">
                            </div>
                            <div class="form-group half-width">
                                <label for="city">City *</label>
                                <input type="text" id="city" name="city" required placeholder="e.g. Seattle">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="notes">Additional Notes</label>
                            <textarea id="notes" name="notes" rows="3" placeholder="Patient details, specific instructions, etc."></textarea>
                        </div>

                        <div class="form-actions mt-4 flex-between">
                            <a href="patient-dashboard.html" class="btn btn-outline">Cancel</a>
                            <button type="submit" class="btn btn-primary" id="btn-submit-request">Submit Request</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/requests.js"></script>
</body>
</html>
